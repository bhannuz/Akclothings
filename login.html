<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in – Wear[M]e</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <a class="logo" href="index.html"><img src="assets/logo-header.svg" alt="Wear[M]e" onerror="this.replaceWith(Object.assign(document.createElement('b'),{className:'logo-txt',textContent:'WEAR[M]E'}))"></a>
  <a class="btn white sm" href="index.html">Back to shop</a>
</header>

<div class="auth-wrap">
  <div class="auth">
    <h1 id="title">Welcome back</h1>
    <div class="tabs">
      <button class="chip" id="tabLogin" aria-pressed="true" type="button">Log in</button>
      <button class="chip" id="tabSignup" aria-pressed="false" type="button">Sign up</button>
    </div>
    <form id="form">
      <div id="emailBox" style="display:grid;gap:14px">
        <div class="so" style="display:none;gap:14px">
          <label>Full name<input id="sName" autocomplete="name"></label>
          <label>Mobile number<input id="sPhone" type="tel" inputmode="numeric" maxlength="14" placeholder="10-digit mobile" autocomplete="tel"></label>
        </div>
        <label><span id="idLabel">Email or mobile number</span><input id="email" type="text" autocomplete="username" placeholder="you@mail.com or 10-digit mobile" required></label>
        <label>Password<input id="password" type="password" minlength="6" autocomplete="current-password" required></label>
        <div class="so" style="display:none;gap:14px">
          <label>Delivery address<input id="sAddr" autocomplete="street-address" placeholder="House no, street, area"></label>
          <div class="two">
            <label>City<input id="sCity" autocomplete="address-level2"></label>
            <label>Pincode<input id="sPin" inputmode="numeric" maxlength="6" autocomplete="postal-code"></label>
          </div>
          <label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="sOpt" checked style="width:auto"> Send me stock updates &amp; offers</label>
        </div>
        <button class="link" id="forgot" type="button">Forgot password?</button>
        <button class="btn pink" id="submit" type="submit">Log in</button>
      </div>
      <p class="msg" id="msg" role="status"></p>
    </form>
    <p class="or">or</p>
    <button class="btn white" id="google" type="button" style="width:100%">Continue with Google</button>
  </div>
</div>

<script type="module" src="js/login.js"></script>
<script type="module" src="js/presence.js"></script>
</body>
</html>
