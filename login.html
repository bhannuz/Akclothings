<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in – VAKON</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <a class="logo" href="index.html">VAKON</a>
  <a class="btn white sm" href="index.html">Back to shop</a>
</header>

<div class="auth-wrap">
  <div class="auth">
    <h1 id="title">Welcome back</h1>
    <div class="tabs">
      <button class="chip" id="tabLogin" aria-pressed="true" type="button">Log in</button>
      <button class="chip" id="tabSignup" aria-pressed="false" type="button">Sign up</button>
      <button class="chip" id="tabPhone" aria-pressed="false" type="button">Mobile</button>
    </div>
    <form id="form">
      <div id="emailBox" style="display:grid;gap:14px">
        <label>Email<input id="email" type="email" autocomplete="email" required></label>
        <label>Password<input id="password" type="password" minlength="6" autocomplete="current-password" required></label>
        <button class="link" id="forgot" type="button">Forgot password?</button>
        <button class="btn pink" id="submit" type="submit">Log in</button>
      </div>
      <div id="phoneBox" style="display:none;gap:14px">
        <label>Mobile number<input id="phone" type="tel" inputmode="numeric" placeholder="10-digit number (+91)" autocomplete="tel"></label>
        <label id="otpLabel" hidden>OTP<input id="otp" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code"></label>
        <button class="btn pink" id="sendOtp" type="button">Send OTP</button>
        <button class="btn pink" id="verifyOtp" type="button" hidden>Verify &amp; continue</button>
        <p class="meta">New number? An account is created automatically.</p>
      </div>
      <p class="msg" id="msg" role="status"></p>
    </form>
    <p class="or">or</p>
    <button class="btn white" id="google" type="button" style="width:100%">Continue with Google</button>
  </div>
</div>

<script type="module" src="js/login.js"></script>
</body>
</html>
