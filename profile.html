<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My profile – Wear[M]e</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<style>
.wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e4e1db}
.t th,.t td{padding:8px 10px;border-bottom:1px solid #ddd;text-align:left;font-size:.9rem;vertical-align:top}
.t th{background:#f4f1ff}
.t{min-width:520px}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html"><img src="assets/logo-header.svg" alt="Wear[M]e" onerror="this.replaceWith(Object.assign(document.createElement('b'),{className:'logo-txt',textContent:'WEAR[M]E'}))"></a>
  <div class="actions"><a class="btn white sm" href="index.html">Back to shop</a><button class="btn sm" id="logout">Log out</button></div>
</header>
<main class="admin">
  <p id="gate" class="meta">Checking login...</p>
  <div id="panel" hidden>
    <h1 class="section-title">My profile</h1>
    <form id="form" class="panel">
      <label>Email<input id="email" disabled></label>
      <div class="two">
        <label>Full name<input id="name" required></label>
        <label>Phone<input id="phone" type="tel" required placeholder="10-digit mobile"></label>
      </div>
      <label>Delivery address<input id="address" required placeholder="House no, street, area"></label>
      <div class="two">
        <label>City<input id="city" required></label>
        <label>Pincode<input id="pincode" required pattern="[0-9]{6}" placeholder="500001"></label>
      </div>
      <label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="opt" style="width:auto"> Send me stock updates &amp; offers</label>
      <p class="msg" id="msg" role="status"></p>
      <button class="btn pink" type="submit">Save</button>
    </form>
    <h2 class="section-title" id="orders" style="margin-top:40px">My orders</h2>
    <div class="wrap"><table class="t" id="list"></table></div>
    <h2 class="section-title" style="margin-top:40px">Contact us</h2>
    <form id="reqForm" class="panel">
      <div class="two">
        <label>Request type<select id="rType"><option>Product request</option><option>Back in stock alert</option><option>Order help</option><option>Other</option></select></label>
        <label>Message<input id="rMsg" required placeholder="Tell us what you need"></label>
      </div>
      <p class="msg" id="rmsg" role="status"></p>
      <button class="btn pink" type="submit">Send request</button>
    </form>
    <div class="wrap" style="margin-top:14px"><table class="t" id="reqList"></table></div>
  </div>
</main>
<script type="module" src="js/profile.js"></script>
<script type="module" src="js/presence.js"></script>
</body>
</html>
